name: kostify
description: Kostify - Smart Boarding Management System
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # --- Database ---
  sqflite: ^2.3.2
  path: ^1.9.0

  # --- Auth & Security ---
  local_auth: ^2.2.0
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.3

  # --- Navigation & State ---
  get: ^4.6.6

  # --- UI Components ---
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1

  # --- Kamera & Gambar ---
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0

  # --- OCR / ML Kit ---
  google_mlkit_text_recognition: ^0.13.0

  # --- Maps & LBS ---
  google_maps_flutter: ^2.9.0
  geolocator: ^12.0.0
  geocoding: ^3.0.0

  # --- Sensor ---
  sensors_plus: ^5.0.1

  # --- Connectivity & HTTP ---
  connectivity_plus: ^6.0.5
  http: ^1.2.2
  dio: ^5.7.0

  # --- Notifikasi ---
  flutter_local_notifications: ^17.2.3

  # --- Kurs Mata Uang ---
  # (Pakai ExchangeRate-API via http, tidak perlu package khusus)

  # --- Lainnya ---
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.1
  permission_handler: ^11.3.1
  flutter_animate: ^4.5.0
  lottie: ^3.1.2
  flutter_dotenv: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/icons/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
